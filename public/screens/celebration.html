<!doctype html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: #FFFFFF; background: #5856D6; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
    a { color: #FFFFFF; } a:hover { color: #F2F2F7; }
    button { font-family: inherit; }
  </style>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; background: linear-gradient(165deg, #007AFF 0%, #5856D6 48%, #AF52DE 100%); color: #FFFFFF;">

  <!-- a few still motes — the one loud moment, still restrained -->
  <span style="position: absolute; left: 44px; top: 120px; width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55);"></span>
  <span style="position: absolute; left: 300px; top: 92px; width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5);"></span>
  <span style="position: absolute; left: 330px; top: 230px; width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.35);"></span>
  <span style="position: absolute; left: 70px; top: 300px; width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.45);"></span>
  <span style="position: absolute; left: 250px; top: 560px; width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.4);"></span>
  <span style="position: absolute; left: 110px; top: 620px; width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.5);"></span>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 28px; gap: 10px;">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.85;">Milestone</span>
    <span style="font-size: 64px; font-weight: 700; letter-spacing: -0.03em; line-height: 1;">$4,000</span>
    <span style="font-size: 30px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1;">Peru, funded.</span>
    <span style="font-size: 17px; line-height: 1.45; opacity: 0.92; max-width: 30ch; margin-top: 6px;">Fifteen paydays. Four months. Peru just moved from a plan to a booking — and the roadmap has already moved on.</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 20px 22px 20px;">
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; margin-bottom: 8px; border-radius: 999px; background: rgba(255,255,255,0.16); font-size: 13px; font-weight: 600;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
      <span>Your $260 a week now flows to the emergency fund · March</span>
    </div>
    <button style="height: 52px; border: 0; border-radius: 999px; background: #FFFFFF; color: #5856D6; font-size: 17px; font-weight: 600; cursor: pointer;">Book the flights</button>
    <button style="height: 48px; border: 2px solid rgba(255,255,255,0.7); border-radius: 999px; background: transparent; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer;">Back to the path</button>
  </div>
</div>
</body>
</html>
